<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BHUKH LAGI — Your campus food-court ordering app. Aaj kya khaoge?">
  <meta name="theme-color" content="#2F4156">
  <title>BHUKH LAGI — Aaj kya khaoge?</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Caveat:wght@400;600&display=swap" rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/svg/logo-icon.svg">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading-screen" class="loading-screen">
    <div class="loading-screen__content">
      <div class="loading-screen__logo" aria-hidden="true">
        <img src="assets/svg/logo-icon.svg" alt="" width="64" height="64" class="loading-screen__logo-img">
      </div>
      <div class="loading-screen__bar">
        <div class="loading-screen__bar-fill"></div>
      </div>
      <p class="loading-screen__message font-handwritten">Checking what's cooking…</p>
    </div>
  </div>

  <!-- App Shell -->
  <div id="app" class="app" style="display:none;">

    <!-- Desktop Sidebar Navigation (visible ≥ 1024px) -->
    <aside id="sidebar" class="sidebar" role="navigation" aria-label="Main sidebar navigation">
      <div class="sidebar__brand">
        <a href="#home" class="sidebar__logo-link" aria-label="BHUKH LAGI Home">
          <img src="assets/svg/logo-compact.svg" alt="BHUKH LAGI" width="140" height="28" class="sidebar__logo-img">
        </a>
        <p class="sidebar__tagline-top font-handwritten">Aaj kya khaoge?</p>
      </div>
      <nav class="sidebar__nav">
        <a href="#home" class="sidebar__link sidebar__link--active" data-page="home">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Home</span>
        </a>
        <a href="#stalls" class="sidebar__link" data-page="stalls">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v4H3z"/><path d="M3 7v13h18V7"/><path d="M8 7v5a4 4 0 008 0V7"/></svg>
          <span>Food Courts</span>
        </a>
        <a href="#stalls" class="sidebar__link" data-page="menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h7"/></svg>
          <span>Menu</span>
        </a>
        <a href="#orders" class="sidebar__link" data-page="orders">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          <span>My Orders</span>
        </a>
        <a href="#cart" class="sidebar__link" data-page="cart">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
          <span>Cart</span>
          <span id="sidebar-cart-badge" class="sidebar__badge" style="display:none;">0</span>
        </a>
        <a href="#profile" class="sidebar__link" data-page="profile">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Profile</span>
        </a>

        <div class="sidebar__divider"></div>

        <a href="#admin/dashboard" class="sidebar__link sidebar__link--admin" id="sidebar-admin-link" data-page="admin" style="display:none;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          <span>Admin Panel</span>
        </a>
      </nav>
      <div class="sidebar__footer">
        <div class="sidebar__doodle-quote font-handwritten">
          Good Food<br>Good People<br>Brighter Tomorrows
        </div>
        <div class="sidebar__mountains" aria-hidden="true">
          <svg viewBox="0 0 200 60" preserveAspectRatio="none" width="100%" height="45">
            <polygon points="0,60 30,22 70,45 110,12 150,42 180,18 200,60" fill="rgba(255,255,255,0.06)"/>
            <polygon points="0,60 50,32 90,52 130,25 170,44 200,60" fill="rgba(255,255,255,0.04)"/>
          </svg>
        </div>
        <div class="sidebar__campus-tag">
          <div class="sidebar__upes-info">
            <span class="sidebar__upes-name">UPES</span>
            <span class="sidebar__upes-city">Dehradun</span>
          </div>
          <div class="sidebar__upes-divider"></div>
          <div class="sidebar__upes-motto">
            <span>Eat</span>
            <span>Learn</span>
            <span>Grow</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Student Navbar (Desktop) -->
    <nav id="navbar" class="navbar" role="navigation" aria-label="Main navigation">
      <div class="navbar__inner">
        <a href="#home" class="navbar__logo" aria-label="BHUKH LAGI Home">
          <img src="assets/svg/logo-compact.svg" alt="BHUKH LAGI" width="160" height="32" class="navbar__logo-img">
        </a>

        <div class="navbar__search" id="navbar-search">
          <svg class="navbar__search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
          </svg>
          <input type="text" id="search-input" class="navbar__search-input" placeholder="Search food, stalls or cravings…" aria-label="Search food and stalls" autocomplete="off">
        </div>

        <div class="navbar__actions">
          <!-- Bell notification -->
          <button class="navbar__bell-btn" aria-label="Notifications" id="bell-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/>
            </svg>
          </button>
          <!-- Cart -->
          <button id="cart-btn" class="navbar__cart-btn" aria-label="View cart">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/>
            </svg>
            <span id="cart-badge" class="navbar__cart-badge" style="display:none;">0</span>
          </button>
          <!-- User pill (populated by Navbar.renderUserPill) -->
          <div id="navbar-user" class="navbar__user-pill"></div>
        </div>
      </div>
    </nav>

    <!-- Main Content Area -->
    <main id="main-content" class="main-content" role="main">
      <!-- Pages rendered here by router -->
    </main>

    <!-- Mobile Bottom Navigation -->
    <nav id="bottom-nav" class="bottom-nav" role="navigation" aria-label="Mobile navigation">
      <a href="#home" class="bottom-nav__item active" data-page="home" aria-label="Home">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Home</span>
      </a>
      <a href="#stalls" class="bottom-nav__item" data-page="stalls" aria-label="Food Stalls">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3h18v4H3z"/><path d="M3 7v13h18V7"/><path d="M8 7v5a4 4 0 008 0V7"/>
        </svg>
        <span>Stalls</span>
      </a>
      <a href="#orders" class="bottom-nav__item" data-page="orders" aria-label="My Orders">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
        <span>Orders</span>
      </a>
      <a href="#cart" class="bottom-nav__item" data-page="cart" aria-label="Cart">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/>
        </svg>
        <span id="bottom-cart-badge-wrap">Cart</span>
      </a>
      <a href="#profile" class="bottom-nav__item" data-page="profile" aria-label="Profile">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
        <span>Profile</span>
      </a>
    </nav>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- Floating Cart Bar (shown on stall detail pages) -->
    <div id="floating-cart" class="floating-cart" style="display:none;">
      <div class="floating-cart__inner">
        <div class="floating-cart__info">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
          <span id="floating-cart-count">0 items</span>
          <span class="floating-cart__divider">•</span>
          <span id="floating-cart-total">₹0</span>
        </div>
        <a href="#cart" class="floating-cart__btn">View Cart →</a>
      </div>
    </div>
  </div>

  <!-- Admin Shell (separate nav) -->
  <div id="admin-app" class="admin-app" style="display:none;">
    <div class="admin-mobile-header">
      <button class="admin-mobile-header__menu" aria-label="Toggle menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <img src="assets/svg/logo-compact.svg" alt="BHUKH LAGI Admin" width="120" height="24" style="filter:brightness(0) saturate(100%) invert(25%) sepia(10%) saturate(1500%) hue-rotate(170deg);">
    </div>
    <div class="admin-overlay"></div>
    <aside id="admin-sidebar" class="admin-sidebar" role="navigation" aria-label="Admin navigation">
      <div class="admin-sidebar__header">
        <svg viewBox="0 0 120 30" width="120" height="30" class="admin-sidebar__logo">
          <text x="0" y="18" fill="#2F4156" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="14" letter-spacing="-0.5">BL</text>
          <text x="26" y="18" fill="#567C8D" font-family="'Space Grotesk', sans-serif" font-weight="500" font-size="11">ADMIN</text>
        </svg>
      </div>
      <nav class="admin-sidebar__nav">
        <a href="#admin/dashboard" class="admin-sidebar__item active" data-page="admin-dashboard">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span>Dashboard</span>
        </a>
        <a href="#admin/orders" class="admin-sidebar__item" data-page="admin-orders">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span>Orders</span>
        </a>
        <a href="#admin/menu" class="admin-sidebar__item" data-page="admin-menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          <span>Menu</span>
        </a>
        <a href="#admin/availability" class="admin-sidebar__item" data-page="admin-availability">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>Availability</span>
        </a>
      </nav>
      <div class="admin-sidebar__footer">
        <button id="admin-logout-btn" class="admin-sidebar__item admin-sidebar__logout">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>Logout</span>
        </button>
      </div>
    </aside>
    <main id="admin-content" class="admin-content" role="main">
      <!-- Admin pages rendered here -->
    </main>
  </div>


  <!-- Scripts -->
  <script src="js/brand.js"></script>
  <script src="js/utils/dom.js"></script>
  <script src="js/utils/time.js"></script>
  <script src="js/utils/order-id.js"></script>
  <script src="js/store.js"></script>
  <script src="js/data.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/loading.js"></script>
  <script src="js/components/empty-state.js"></script>
  <script src="js/components/search.js"></script>
  <script src="js/components/navbar.js"></script>
  <script src="js/components/sidebar.js"></script>
  <script src="js/components/hero.js"></script>
  <script src="js/components/stall-card.js"></script>
  <script src="js/components/food-card.js"></script>
  <script src="js/components/quantity-control.js"></script>
  <script src="js/components/cart.js"></script>
  <script src="js/components/order-timeline.js"></script>
  <script src="js/components/streak.js"></script>
  <script src="js/pages/login.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/stalls.js"></script>
  <script src="js/pages/stall-detail.js"></script>
  <script src="js/pages/cart-page.js"></script>
  <script src="js/pages/orders.js"></script>
  <script src="js/pages/order-detail.js"></script>
  <script src="js/pages/profile.js"></script>
  <script src="js/pages/admin/dashboard.js"></script>
  <script src="js/pages/admin/order-queue.js"></script>
  <script src="js/pages/admin/menu-mgmt.js"></script>
  <script src="js/pages/admin/availability.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
