<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <base href="../">
  <title>Screenshot Harness</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body style="margin:0;padding:0;background:var(--cream);">
  <div id="app" class="app" style="display:flex;">
    <main id="main-content" class="main-content" style="flex:1;min-height:100vh;"></main>
  </div>

  <script src="../js/brand.js"></script>
  <script src="../js/utils/dom.js"></script>
  <script src="../js/utils/time.js"></script>
  <script src="../js/utils/order-id.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/loading.js"></script>
  <script src="../js/components/empty-state.js"></script>
  <script src="../js/components/search.js"></script>
  <script src="../js/components/navbar.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/hero.js"></script>
  <script src="../js/components/stall-card.js"></script>
  <script src="../js/components/food-card.js"></script>
  <script src="../js/components/quantity-control.js"></script>
  <script src="../js/components/cart.js"></script>
  <script src="../js/components/order-timeline.js"></script>
  <script src="../js/components/streak.js"></script>
  <script src="../js/pages/login.js"></script>
  <script src="../js/pages/home.js"></script>
  <script src="../js/pages/stalls.js"></script>
  <script src="../js/pages/stall-detail.js"></script>
  <script src="../js/pages/cart-page.js"></script>
  <script src="../js/pages/orders.js"></script>
  <script src="../js/pages/order-detail.js"></script>
  <script src="../js/pages/profile.js"></script>
  <script src="../js/router.js"></script>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const view = urlParams.get('view') || 'home';

    Store.setUser({
      id: '8650023444',
      name: 'Tilak Verma',
      role: 'student',
      stallId: null
    });

    const main = document.getElementById('main-content');

    if (view === 'login') {
      LoginPage.render();
      document.getElementById('lp-student-name').value = 'Tilak Verma';
      document.getElementById('lp-student-input').value = '8650023444';
    } else if (view === 'home') {
      HomePage.render(main);
    } else if (view === 'profile') {
      ProfilePage.render(main);
    } else if (view === 'chaigaram') {
      StallDetailPage.render(main, 'chaigaram');
    } else if (view === 'cart') {
      Store.clearCart();
      Store.addToCart('chaigaram', 'Chai Garam', StallData.getItem('CGR001'));
      Store.addToCart('chaigaram', 'Chai Garam', StallData.getItem('BIT001'));
      CartPage.render(main);
    }
  </script>
</body>
</html>
