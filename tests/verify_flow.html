<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BHUKH LAGI — Comprehensive Verification</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
  <style>
    body { font-family: monospace; padding: 20px; background: #fafafa; }
    .suite { margin-bottom: 20px; border: 1px solid #ddd; border-radius: 8px; background: white; padding: 16px; }
    .suite h2 { font-size: 16px; margin-bottom: 10px; color: #2F4156; }
    .item { padding: 4px 8px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
    .pass { color: #0f766e; }
    .fail { color: #b91c1c; font-weight: bold; }
    .summary { font-size: 16px; font-weight: bold; margin-top: 16px; padding: 12px; border-radius: 6px; }
    .summary.all-pass { background: #dcfce7; color: #166534; }
    .summary.some-fail { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <h1>BHUKH LAGI — Verification Runner</h1>
  <div id="output"></div>

  <!-- Hidden app containers for rendering components -->
  <div id="test-container" style="display:none;"></div>

  <!-- Scripts in order -->
  <script src="../js/brand.js"></script>
  <script src="../js/utils/dom.js"></script>
  <script src="../js/utils/time.js"></script>
  <script src="../js/utils/order-id.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/loading.js"></script>
  <script src="../js/components/empty-state.js"></script>
  <script src="../js/components/search.js"></script>
  <script src="../js/components/navbar.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/hero.js"></script>
  <script src="../js/components/stall-card.js"></script>
  <script src="../js/components/food-card.js"></script>
  <script src="../js/components/quantity-control.js"></script>
  <script src="../js/components/cart.js"></script>
  <script src="../js/components/order-timeline.js"></script>
  <script src="../js/components/streak.js"></script>
  <script src="../js/pages/login.js"></script>
  <script src="../js/pages/home.js"></script>
  <script src="../js/pages/stalls.js"></script>
  <script src="../js/pages/stall-detail.js"></script>
  <script src="../js/pages/cart-page.js"></script>
  <script src="../js/pages/orders.js"></script>
  <script src="../js/pages/order-detail.js"></script>
  <script src="../js/pages/profile.js"></script>
  <script src="../js/pages/admin/order-queue.js"></script>
  <script src="../js/router.js"></script>

  <script>
    const results = [];
    function assert(suite, testName, condition, detail) {
      results.push({ suite, testName, pass: !!condition, detail: detail || '' });
    }

    async function runVerification() {
      const container = document.getElementById('test-container');

      // ── 1. STUDENT LOGIN FORM & FIELDS ──
      LoginPage.render();
      const nameInput = document.getElementById('lp-student-name');
      const idInput = document.getElementById('lp-student-input');
      const adminNameInput = document.getElementById('lp-admin-section').querySelector('#lp-student-name');
      const roleStudentBtn = document.getElementById('role-student');
      const roleManagerBtn = document.getElementById('role-manager');
      const ctaBtn = document.getElementById('lp-cta-btn');

      assert('Student Login', 'Name field exists (#lp-student-name)', !!nameInput);
      assert('Student Login', 'SAP ID / Phone field remains (#lp-student-input)', !!idInput);
      assert('Student Login', 'Stall Manager login does NOT have name field', !adminNameInput);

      // Submit valid student login
      nameInput.value = 'Tilak Verma';
      idInput.value = '8650023444';
      LoginPage._submit();

      const user = Store.getUser();
      assert('Student Login', 'Name is stored in LocalStorage (Store.getUser)', user && user.name === 'Tilak Verma');
      assert('Student Login', 'SAP ID is stored in LocalStorage', user && user.id === '8650023444');
      assert('Student Login', 'Role is stored as "student"', user && user.role === 'student');

      // ── 2. HEADER USER PILL ──
      const headerHtml = HomePage._renderDesktopHeader(user);
      container.innerHTML = headerHtml;
      const hName = container.querySelector('.hp-desktop-header__user-name');
      const hId = container.querySelector('.hp-desktop-header__user-id');
      const hRole = container.querySelector('.hp-desktop-header__user-role');
      assert('Header Pill', 'Name appears in header', hName && hName.textContent.trim() === 'Tilak Verma');
      assert('Header Pill', 'SAP ID appears in header', hId && hId.textContent.trim() === '8650023444');
      assert('Header Pill', 'Role appears in header', hRole && hRole.textContent.trim() === 'Student');

      // ── 3. HOME GREETING ──
      const greeting = HomePage._getGreeting(user);
      assert('Home Greeting', 'Greeting contains student name', greeting && greeting.includes('Tilak Verma'));
      const heroHtml = HomePage._renderHero(user);
      assert('Home Greeting', 'Subline "Your campus cravings, sorted." present', heroHtml.includes('Your campus cravings, sorted.'));

      // ── 4. PROFILE PAGE ──
      ProfilePage.render(container);
      const pName = container.querySelector('.profile-card__name');
      const pId = container.querySelector('.profile-card__id');
      const pRole = container.querySelector('.profile-card__role');
      assert('Profile Page', 'Name appears in profile', pName && pName.textContent.trim() === 'Tilak Verma');
      assert('Profile Page', 'Student ID appears in profile format', pId && pId.textContent.trim() === 'Student ID: 8650023444');
      assert('Profile Page', 'Role appears as Student in profile', pRole && pRole.textContent.trim() === 'Role: Student');

      // ── 5. ALL 362 MENU ITEMS HAVE DEDICATED WEBP PHOTOGRAPHY ──
      const allItems = StallData.getAllMenuItems();
      assert('Menu Items', 'Total 362 menu items present', allItems.length === 362, 'Found ' + allItems.length);

      const itemsMissingImage = allItems.filter(i => !i.image);
      assert('Menu Items', 'Every menu item has an image field in data.js', itemsMissingImage.length === 0, 'Missing: ' + itemsMissingImage.length);

      const itemsWithInvalidPath = allItems.filter(i => !i.image || !i.image.startsWith('assets/images/food/') || !i.image.endsWith('.webp'));
      assert('Menu Items', 'Every image path matches assets/images/food/<ITEM_ID>.webp', itemsWithInvalidPath.length === 0, 'Invalid: ' + itemsWithInvalidPath.length);

      // ── 6. CHAI GARAM & BITE IT COVERAGE ──
      const cgStall = StallData.getStall('chaigaram');
      const cgItems = cgStall ? Object.values(cgStall.menu).flat() : [];
      const biteItItems = cgItems.filter(i => i.subBrand === 'Bite It' || (i.id && i.id.startsWith('BIT')));
      assert('Chai Garam & Bite It', 'Chai Garam menu exists', cgItems.length > 0, 'Count: ' + cgItems.length);
      assert('Chai Garam & Bite It', 'Bite It sub-brand items exist', biteItItems.length === 49, 'Count: ' + biteItItems.length);
      const biteItMissing = biteItItems.filter(i => !i.image || !i.image.startsWith('assets/images/food/BIT'));
      assert('Chai Garam & Bite It', 'Every Bite It item has dedicated BIT WebP image', biteItMissing.length === 0, 'Missing: ' + biteItMissing.length);

      // ── 7. FOOD CARD COMPONENT RENDERING ──
      let totalRendered = 0;
      let totalPlaceholders = 0;
      let totalImgPhotos = 0;
      let totalBadges = 0;
      let totalImageWrappers = 0;
      allItems.forEach(item => {
        const cardHtml = FoodCard.render(item, item.stallId, 'Stall');
        totalRendered++;
        if (cardHtml.includes('<img')) {
          totalImgPhotos++;
        }
        if (cardHtml.includes('food-card__image')) {
          totalImageWrappers++;
        }
        if (cardHtml.includes('food-card__icon-badge')) {
          totalBadges++;
        }
        if (cardHtml.includes('food-card__image-placeholder')) {
          totalPlaceholders++;
        }
      });
      assert('Food Card Rendering', 'All 362 cards rendered without food photographs (img count: 0)', totalRendered === 362 && totalImgPhotos === 0, 'Photos remaining: ' + totalImgPhotos);
      assert('Food Card Rendering', 'All 362 cards render compact icon badge', totalBadges === 362, 'Badges found: ' + totalBadges);
      assert('Food Card Rendering', 'Zero cards contain image wrappers or placeholders', totalImageWrappers === 0 && totalPlaceholders === 0, 'Wrappers: ' + totalImageWrappers + ', Placeholders: ' + totalPlaceholders);

      // ── 8. SEARCH, CART & ORDER FLOWS ──
      const searchRes = StallData.searchItems('Dosa');
      assert('Search', 'Search finds items', searchRes.items && searchRes.items.length > 0);

      Store.clearCart();
      const samosaItem = StallData.getItem('MAX023');
      Store.addToCart('maximus', 'Maximus Live Counter', samosaItem);
      const cart = Store.getCart();
      assert('Cart', 'Item added to cart with qty', cart.items.length === 1 && cart.items[0].qty === 1);

      // ── 9. PAY AT COUNTER CHECKOUT (RAZORPAY REMOVED) ──
      const summaryHtml = CartComponent.renderSummary(cart);
      assert('Pay at Counter Checkout', 'Pay at Counter option rendered', summaryHtml.includes('Pay at Counter'));
      assert('Pay at Counter Checkout', 'Place Order button text displays rupee total', summaryHtml.includes('Place Order \u2014 \u20B9'));
      assert('Pay at Counter Checkout', 'No Pay Online option rendered', !summaryHtml.includes('Pay Online'));
      assert('Pay at Counter Checkout', 'No Test Mode badge rendered', !summaryHtml.includes('Test Mode'));
      assert('Pay at Counter Checkout', 'No Razorpay text rendered', !summaryHtml.toLowerCase().includes('razorpay'));

      // Test Pay at Counter Order Storage
      const testCounterOrder = {
        id: 'BL99992',
        orderId: 'BL99992',
        stallId: 'maximus',
        stallName: 'Maximus Live Counter',
        items: [{ id: 'MAX023', name: 'Samosa', qty: 1, price: 40, veg: true }],
        total: 40,
        status: 'PENDING',
        orderStatus: 'PENDING',
        paymentMethod: 'PAY_AT_COUNTER',
        paymentStatus: 'PAY_AT_COUNTER',
        placedAt: new Date().toISOString()
      };
      Store.addOrder(testCounterOrder);
      const fetchedCounter = Store.getOrder('BL99992');
      assert('Payment Store', 'Pay at counter order stored with PAY_AT_COUNTER', fetchedCounter.paymentStatus === 'PAY_AT_COUNTER');
      assert('Payment Store', 'No Razorpay fields on counter order', fetchedCounter.razorpayOrderId === undefined && fetchedCounter.razorpayPaymentId === undefined);

      // Test Order Detail & Admin Queue Rendering
      const orderDetailContainer = document.createElement('div');
      OrderDetailPage.render(orderDetailContainer, 'BL99992');
      assert('Order Confirmation UI', 'Order detail displays pay at counter info', orderDetailContainer.innerHTML.includes('Pay at Counter'));
      assert('Order Confirmation UI', 'No Razorpay payment ID on order detail', !orderDetailContainer.innerHTML.includes('Payment ID'));

      const adminContainer = document.createElement('div');
      Store.setUser({ id: 'admin-maximus', role: 'admin', stallId: 'maximus' });
      AdminOrderQueue.render(adminContainer);
      assert('Admin Order Queue', 'Admin queue displays payment badge PAY AT COUNTER', adminContainer.innerHTML.includes('badge--payment-counter'));


      // Render Results
      const output = document.getElementById('output');
      const grouped = {};
      results.forEach(r => {
        if (!grouped[r.suite]) grouped[r.suite] = [];
        grouped[r.suite].push(r);
      });

      let allPass = true;
      let html = '';
      for (const suite in grouped) {
        html += '<div class="suite"><h2>' + suite + '</h2>';
        grouped[suite].forEach(r => {
          if (!r.pass) allPass = false;
          html += '<div class="item ' + (r.pass ? 'pass' : 'fail') + '">' +
            (r.pass ? '&#10003; ' : '&#10007; ') + r.testName +
            (r.detail ? ' <em>(' + r.detail + ')</em>' : '') +
            '</div>';
        });
        html += '</div>';
      }

      const passCount = results.filter(r => r.pass).length;
      html += '<div class="summary ' + (allPass ? 'all-pass' : 'some-fail') + '">' +
        (allPass ? 'ALL CHECKS PASSED: ' : 'FAILURES DETECTED: ') +
        passCount + ' / ' + results.length + ' checks passed' +
        '</div>';

      output.innerHTML = html;
      window.verificationCompleted = true;
      window.allPass = allPass;
    }

    runVerification().catch(function (err) {
      document.getElementById('output').innerHTML = '<div class="fail">ERROR: ' + (err.stack || err) + '</div>';
    });
  </script>
</body>
</html>
