<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-label="BHUKH LAGI chef mascot">
  <!-- Chef hat — puffy three-bump top -->
  <path d="M28,28 Q26,18 30,14 Q32,10 36,10 Q38,10 40,12 Q44,10 46,14 Q50,18 48,28" fill="none" stroke="#3A3A3A" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Hat brim band -->
  <rect x="26" y="27" width="24" height="5" rx="2.5" fill="none" stroke="#3A3A3A" stroke-width="1.8"/>
  <!-- Round head -->
  <circle cx="38" cy="42" r="11" fill="none" stroke="#3A3A3A" stroke-width="1.8"/>
  <!-- Dot eyes -->
  <circle cx="34.5" cy="41" r="1.3" fill="#3A3A3A"/>
  <circle cx="41.5" cy="41" r="1.3" fill="#3A3A3A"/>
  <!-- Body — oval torso -->
  <ellipse cx="38" cy="58" rx="8" ry="6" fill="none" stroke="#3A3A3A" stroke-width="1.7"/>
  <!-- Apron vertical lines -->
  <line x1="36" y1="53" x2="36" y2="63" stroke="#3A3A3A" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="38" y1="53" x2="38" y2="63" stroke="#3A3A3A" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="40" y1="53" x2="40" y2="63" stroke="#3A3A3A" stroke-width="1.1" stroke-linecap="round"/>
  <!-- Right arm (to the right side, relaxed) -->
  <path d="M46,56 Q54,52 56,50" fill="none" stroke="#3A3A3A" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Left arm extended holding cloche -->
  <path d="M30,56 Q22,50 18,50" fill="none" stroke="#3A3A3A" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Serving dome/cloche -->
  <path d="M10,50 Q14,43 22,43 Q30,43 26,50" fill="none" stroke="#3A3A3A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M8,50 L28,50" fill="none" stroke="#3A3A3A" stroke-width="1.7" stroke-linecap="round"/>
  <!-- Legs -->
  <path d="M34,64 Q33,70 31,74" fill="none" stroke="#3A3A3A" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M42,64 Q43,70 45,74" fill="none" stroke="#3A3A3A" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Feet -->
  <path d="M28,74 L34,74" fill="none" stroke="#3A3A3A" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M45,74 L51,74" fill="none" stroke="#3A3A3A" stroke-width="1.8" stroke-linecap="round"/>
</svg>
